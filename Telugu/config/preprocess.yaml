dataset: Telugu
path:
  corpus_path: ../data
  lexicon_path: lexicon/librispeech-lexicon.txt
  raw_path: ../data
  preprocessed_path: ../preprocessed_data
preprocessing:
  val_size: 20
  text:
    text_cleaners:
    - basic_cleaners
    language: te
  audio:
    sampling_rate: 16000
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 7600
  pitch:
    feature: frame_level
    normalization: true
  energy:
    feature: frame_level
    normalization: true
